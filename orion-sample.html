:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-num: "Hiragino Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;

  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --tap: 44px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 999px;
  --shadow-sheet: 0 -2px 12px rgba(0,0,0,0.12);
  --icon-stroke: 2px;
  --icon-size: 24px;
}
.title { font-family: var(--font-sans); font-size: 22px; line-height: 30px; font-weight: 700; }
.heading { font-family: var(--font-sans); font-size: 17px; line-height: 24px; font-weight: 700; }
.body { font-family: var(--font-sans); font-size: 16px; line-height: 26px; font-weight: 400; }
.small { font-family: var(--font-sans); font-size: 13px; line-height: 18px; font-weight: 400; }

.button { font-family: var(--font-sans); font-size: 16px; line-height: 24px; font-weight: 600; }
.num-xl { font-family: var(--font-num); font-size: 40px; line-height: 44px; font-weight: 700; }
.num-lg { font-family: var(--font-num); font-size: 24px; line-height: 30px; font-weight: 700; }
.num { font-family: var(--font-num); font-size: 16px; line-height: 24px; font-weight: 500; }

/* TENPO OS 画面の骨組み（layout.css）
   tokens.css の後に読む。画面はこの部品だけで組む。独自の px・独自の幅は書かない。
   崩れない3原則：(1) 幅は親から（min-width:0・minmax(0,1fr)） (2) 文字は1行なら省略・複数行なら折り返し (3) 高さは中身で決めない所（行・ボタン・札）は最小値を持つ */

*, *::before, *::after { box-sizing: border-box; min-width: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 16px; line-height: 26px;
  overflow-wrap: anywhere; line-break: strict;
  -webkit-font-smoothing: antialiased;
}
img, svg, video { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .num-lg, .num-xl, .tabular { font-variant-numeric: tabular-nums; }

/* ---- 画面の外枠：上の帯・中身・下のタブ ---- */
.app { min-height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; container: app / inline-size; }
.app-head {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: calc(var(--space-2) + env(safe-area-inset-top)) var(--space-4) var(--space-2);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3);
  min-height: 56px; border-bottom: 1px solid var(--border);
}
.app-head .title { font-size: 22px; line-height: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-head .store { font-size: 13px; line-height: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-body { padding: var(--space-4) var(--space-4) calc(var(--space-8)); max-width: 640px; width: 100%; margin: 0 auto; }
.app-tabs {
  position: sticky; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--border);
  padding: var(--space-1) var(--space-2) calc(var(--space-1) + env(safe-area-inset-bottom));
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
}
.tab { display: grid; justify-items: center; gap: 2px; padding: var(--space-1) 0; min-height: var(--tap); color: var(--ink-2); font-size: 11px; line-height: 14px; text-decoration: none; position: relative; }
.tab[aria-current] { color: var(--primary-text); font-weight: 600; }
.tab span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .count { position: absolute; top: 0; left: calc(50% + 6px); }

/* 2列（iPad・PC）：同じ画面を2列にするだけ。画面の幅ではなく .app 自身の幅で決める（コンテナクエリ） */
@container app (min-width: 768px) {
  .app-body { max-width: 1120px; }
  .cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); align-items: start; }
}

/* ---- 積む・並べる ---- */
.stack { display: grid; gap: var(--space-3); }
.stack-lg { display: grid; gap: var(--space-6); }
.row { display: flex; align-items: center; gap: var(--space-2); }
.row > .grow { flex: 1 1 0; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
.tiles-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
/* 3つ並びは 430px 以上だけ。狭いときは2列にし、3つ目は横いっぱい（24px の数字が6桁入る幅を守る） */
@container app (max-width: 429px) { .tiles-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles-3 > :nth-child(3):last-child { grid-column: span 2; } }

/* ---- 節 ---- */
.section-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: var(--space-3); margin: 0 0 var(--space-2); }
.section-head h2 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.section-head .more { font-size: 13px; line-height: 18px; color: var(--primary-text); white-space: nowrap; }

/* ---- カード ---- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4); }
.card.sunk { background: var(--surface-2); border-color: transparent; }

/* 数字の札（半分の幅に置く）。高さは固定、数字は yen(n,'card') でまとめる */
.stat { display: grid; grid-template-rows: 18px 30px 18px; gap: 2px; min-height: 96px; }
.stat .label { font-size: 13px; line-height: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .value { font-family: var(--font-num); font-size: 24px; line-height: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .sub { font-size: 13px; line-height: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 画面いっぱいの数字。yen(n,'hero') */
.hero { display: grid; gap: var(--space-1); }
.hero .value { font-family: var(--font-num); font-size: 40px; line-height: 44px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@container app (max-width: 359px) { .hero .value { font-size: 32px; line-height: 36px; } }

/* ---- 一覧の行：左アイコン・題と補足・右の値か札 ---- */
.list { display: grid; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.item {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) fit-content(40%); align-items: center; gap: var(--space-3);
  min-height: 56px; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); color: inherit; text-decoration: none;
}
.item:first-child { border-top: 0; }
.item .icon { width: 20px; height: 20px; color: var(--ink-2); }
.item .main { display: grid; gap: 2px; }
.item .t { font-size: 16px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .t.wrap { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item .s { font-size: 13px; line-height: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .right { justify-self: end; max-width: 100%; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.item.no-icon { grid-template-columns: minmax(0, 1fr) fit-content(40%); }

/* ---- 札（状態） ---- */
.badge { display: inline-block; vertical-align: middle; height: 22px; padding: 0 var(--space-2); border-radius: var(--radius-sm); font-size: 12px; line-height: 22px; font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.badge svg { width: 14px; height: 14px; vertical-align: -3px; margin-right: 2px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.plain { background: var(--surface-2); color: var(--ink-2); }
.count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-full); background: var(--danger); color: var(--bg); font-size: 11px; line-height: 1; font-weight: 700; }

/* ---- ボタン ---- */
.btn {
  display: inline-block; text-align: center;
  min-height: var(--tap); padding: 9px var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); font-size: 16px; line-height: 24px; font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.btn svg { width: 20px; height: 20px; vertical-align: -5px; margin-right: var(--space-1); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--primary-text); }
.btn.block { width: 100%; }
.btn.sq { padding-left: 0; padding-right: 0; min-width: var(--tap); }   /* 記号1つのボタン（− ＋ ×） */
.btn:focus-visible, .tab:focus-visible, .item:focus-visible, .field :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* ボタンは横に2つまで。3つ以上は自動で縦に積む */
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: var(--space-2); }
.actions.stack, .actions:has(> :nth-child(3)) { grid-template-columns: minmax(0, 1fr); }

/* ---- 入力：ラベルは上、1列だけ ---- */
.field { display: grid; gap: var(--space-1); }
.field label { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.field input, .field select, .field textarea {
  width: 100%; min-height: var(--tap); padding: 0 var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); font-size: 16px;
}
.field textarea { min-height: 88px; padding: var(--space-2) var(--space-3); line-height: 24px; resize: vertical; }
.field .help { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.field .err { font-size: 13px; line-height: 18px; color: var(--danger); }
.field.money input { font-family: var(--font-num); text-align: right; font-variant-numeric: tabular-nums; }

/* ---- 表：横にはみ出す分は表だけが横に動く。最初の列を固定、数字は右寄せ ---- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; }
table.t.wide { min-width: 480px; }   /* 列が5つ以上の表に。箱の中だけ横に動く */
table.t th, table.t td { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); text-align: left; white-space: nowrap; font-size: 14px; line-height: 20px; }
table.t th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; border-top: 0; }
table.t th:first-child, table.t td:first-child { position: sticky; left: 0; background: var(--surface); max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
table.t th:first-child { background: var(--surface-2); }
table.t .n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-num); }

/* ---- 空・読み込み・エラー ---- */
.empty { padding: var(--space-6) var(--space-4); text-align: center; color: var(--ink-2); font-size: 14px; line-height: 20px; }
.skeleton { background: var(--surface-2); border-radius: var(--radius-sm); min-height: 20px; }
.banner { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--space-2); align-items: start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); font-size: 14px; line-height: 20px; }
.banner.danger { background: var(--danger-soft); color: var(--ink); } .banner.danger svg { color: var(--danger); }
.banner.warn { background: var(--warn-soft); } .banner.warn svg { color: var(--warn); }
.banner.info { background: var(--info-soft); } .banner.info svg { color: var(--info); }

/* ---- 画面下から出るシート ---- */
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: grid; align-items: end; }
.sheet {
  background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-sheet);
  max-height: 85dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; width: 100%; max-width: 640px; margin: 0 auto;
}
.sheet .head { padding: var(--space-4) var(--space-4) var(--space-2); font-size: 17px; line-height: 24px; font-weight: 700; }
.sheet .body { overflow: auto; padding: 0 var(--space-4) var(--space-4); }
.sheet .foot { padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }

/* ---- 文字の決まり ---- */
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.muted { color: var(--ink-2); }

<script type="module">
// TENPO OS 金額・数の表記（画面側の共通の関数）。README の「金額の表記」の決まりをそのまま実装。
// 使い方： yen(86400) → "86,400円" ／ yen(86400, 'card') → "8.6万円" ／ yen(1234567, 'axis') → "123万"
// 置き場所（place）ごとに「このまま出せる最大の桁」を決め、超えたら万・億でまとめる。
// 正確さが要る場面（exact）は決してまとめない。

const LIMIT = {
  exact: Infinity, // 会計・締め・支払・経費・給与：必ず全桁
  hero: 8,         // 画面いっぱいの大きい数字（num-xl）：12,345,678円 まで
  row: 7,          // 一覧の行の右端（num）：1,234,567円 まで
  card: 6,         // 半分の幅のカード（num-lg）：999,999円 まで
  tile3: 5,        // 3つ並びの札（num-lg）：99,999円 まで。超えたら 24万円
  axis: 0,         // グラフの軸：常に万でまとめる（単位は軸の題に）
};

function group(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// 万・億でまとめる。1万〜9.9万は小数1桁、10万以上は整数の万、1億以上は小数1桁の億。
function compact(n) {
  const neg = n < 0; const a = Math.abs(n);
  let s;
  if (a < 10000) s = group(a);
  else if (a < 100000) s = trim1((a / 10000)) + '万';
  else if (a < 100000000) s = group(Math.round(a / 10000)) + '万';
  else s = trim1(a / 100000000) + '億';
  return (neg ? '-' : '') + s;
}
function trim1(x) { const s = (Math.floor(x * 10) / 10).toFixed(1); return s.endsWith('.0') ? s.slice(0, -2) : s; }

// 金額。unit=false で「円」を外す（列の見出しに円があるとき）。
function yen(n, place = 'exact', unit = true) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const limit = LIMIT[place] ?? Infinity;
  const digits = String(Math.abs(Math.trunc(n))).length;
  const neg = n < 0;
  let s;
  if (digits <= limit) s = (neg ? '-' : '') + group(Math.abs(Math.trunc(n)));
  else s = compact(Math.trunc(n));
  if (place === 'axis') return s; // 軸は単位なし（題に「万円」と書く）
  return unit ? s + '円' : s;
}

// まとめたかどうか（まとめたときは押すと正確な数字を出す）
function isCompact(n, place = 'exact') {
  if (n === null || n === undefined) return false;
  const limit = LIMIT[place] ?? Infinity;
  return String(Math.abs(Math.trunc(n))).length > limit;
}

// 個数・食数など金額以外の数。単位は呼び手が付ける（57食）。
function num(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return (n < 0 ? '-' : '') + group(Math.abs(n));
}

// 割合。小数1桁、100% 以上は整数。
function pct(x) {
  if (x === null || x === undefined || Number.isNaN(x)) return '—';
  const v = x * 100;
  return (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + '%';
}

// 印刷物（会計の帳票）ではマイナスを ▲ にする。
function yenPrint(n) {
  if (n === null || n === undefined) return '—';
  return (n < 0 ? '▲' : '') + group(Math.abs(Math.trunc(n))) + '円';
}

async function rpc(fn, args = {}, bearer = null) {
  const r = await fetch(`${CFG.api}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.key, 'Content-Profile': 'api', 'Accept-Profile': 'api', ...(bearer ? { Authorization: `Bearer ${bearer}` } : {}) }, body: JSON.stringify(args) });
  const text = await r.text(); let body = null; try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!r.ok) { const code = body?.message || body?.error || `http_${r.status}`; const e = new Error(code); e.code = code; e.hint = body?.hint || body?.details; throw e; }
  return body;
}
const call = (fn, args = {}) => rpc(fn, { p_token: TOKEN, ...args });

      <section class="stack"><div class="section-head"><h2>4桁番号</h2></div><div class="dots">${[0, 1, 2, 3].map((i) => `<i class="${pin.length > i ? 'on' : ''}"></i>`).join('')}</div>
        <div class="pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '消す', '0', '戻す'].map((k) => `<button class="btn" type="button" data-k="${k}">${k}</button>`).join('')}</div>
        <div class="small muted">4桁番号では「スタッフ」の操作まで（在庫チェック）。店のことや発注はアカウントで入ってください</div></section>`
      : `<section class="stack"><div class="field"><label for="em">メール</label><input id="em" type="email" autocomplete="username" inputmode="email"></div><div class="field"><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password"></div>
        <div class="actions"><button class="btn primary" id="go">ログイン</button></div>
        <div class="small muted">tenpo-tokyo のアカウント（メール＋パスワード）で本人を確かめ、この店の札を受け取ります。アカウントと「人」の結び付けはオーナーが先に行います</div></section>`}
      <div id="err"></div></main>`;
    root.querySelectorAll('[data-mode]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); mode = a.dataset.mode; draw(); }));
    root.querySelectorAll('[data-p]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); person = a.dataset.p; pin = ''; draw(); }));
    root.querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', async () => {
      const k = b.dataset.k; if (k === '消す') pin = ''; else if (k === '戻す') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
      if (pin.length === 4 && person) { try { const tok = await rpc('pin_login', { p_store: CFG.store, p_person: person, p_pin: pin }); if (!tok) { pin = ''; draw(); root.querySelector('#err').innerHTML = banner('danger', '番号が違います'); return; } return afterLogin(tok); } catch (e) { pin = ''; draw(); root.querySelector('#err').innerHTML = banner('danger', msg(e)); return; } }
      draw();
    }));
    root.querySelector('#go')?.addEventListener('click', async () => {
      const em = root.querySelector('#em').value.trim(), pw = root.querySelector('#pw').value; if (!em || !pw) return;

        const r = await fetch(`${CFG.api}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.key }, body: JSON.stringify({ email: em, password: pw }) });
        const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error_description || j.msg || 'auth'), { code: j.error_code || j.error || 'auth_failed' });
        const tok = await rpc('account_login', { p_store: CFG.store, p_ua: navigator.userAgent.slice(0, 120) }, j.access_token);
        return afterLogin(tok);
      } catch (e) { root.querySelector('#err').innerHTML = banner('danger', e.code === 'forbidden' ? 'このアカウントはまだ「人」と結び付いていません。オーナーに頼んでください' : e.code === 'invalid_credentials' || e.code === 'invalid_grant' ? 'メールかパスワードが違います' : msg(e)); }
    });

}

}

    const d = await call('po_doc', { p_po: id }); const po = await call('po_get', { p_po: id });
    const sh = sheet(`発注書 ${esc(po.label || '')}`, `<div class="stack"><div class="kv"><span class="k">宛先</span><span class="v">${esc(d.to || '（メール未登録）')}</span></div><div class="kv"><span class="k">件名</span><span class="v ellipsis">${esc(d.subject)}</span></div><div class="pre">${esc(d.body)}</div><div class="small muted">CSV：${esc(d.filename)}（${(d.csv || '').split('\n').length - 1}行）</div><div id="poerr"></div></div>`,
      `<div class="actions"><button class="btn" id="copy">本文をコピー</button><button class="btn primary" id="sent">送ったことにする</button></div>`);
    sh.querySelector('#copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(`${d.subject}\n\n${d.body}`); toast('コピーしました'); } catch { toast('コピーできませんでした'); } });
    sh.querySelector('#sent').addEventListener('click', async () => { try { await call('po_mark_ordered', { p_po: id, p_via: 'mail' }); sh.remove(); toast('発注済みにしました'); loadPos(); } catch (e) { sh.querySelector('#poerr').innerHTML = banner('danger', msg(e)); } });
  }
  async function loadPos() {
    const list = await call('pos', { p_open_only: true });
    root.querySelector('#pos').innerHTML = `<div class="section-head"><h2>発注書</h2><span class="small muted">${list.length}</span></div><div class="list">${list.map((p) => `<a class="item" href="#" data-open="${p.id}">${ic('truck', 20, 'icon')}<div class="main"><div class="t">${esc(p.label)} ${esc(p.supplier)}</div><div class="s">納品 ${fmtD(p.deliver_on)} ・ ${Array.isArray(p.lines) ? p.lines.length : ''}品目 ・ ${esc(p.by || '')}</div></div><div class="right">${badge(p.status === 'draft' ? 'info' : p.status === 'ordered' ? 'ok' : 'plain', { draft: '下書き', ordered: '発注済', partial: '一部納品', received: '納品済' }[p.status] || p.status)}</div></a>`).join('') || '<div class="empty">まだありません</div>'}</div>`;
    root.querySelectorAll('[data-open]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); showPo(a.dataset.open).catch(err); }));
  }
  loadPos().catch(() => {});
}
const fmtQ = (q) => q == null ? '—' : num(Math.round(Number(q) * 100) / 100);

/* ===== 画面4：わたし ===== */
async function screenMe(root) {
  root.innerHTML = `${head('わたし')}<main class="app-body stack-lg">
    <div class="card stack"><div class="kv"><span class="k">名前</span><span class="v">${esc(ME.person.name)}</span></div><div class="kv"><span class="k">役割</span><span class="v">${esc(roleJa(ME.role))}</span></div><div class="kv"><span class="k">店</span><span class="v">${esc(ME.store.name)}</span></div></div>
    ${banner('info', 'これはサンプル店舗です。本物のオリオンの売上・勤怠には何も書きません。物の台帳（品目・レシピ・仕入先）は 11/9 時点の写しです')}
    <div class="actions"><button class="btn" id="theme">暗い画面 ⇄ 明るい画面</button><button class="btn" id="logout">${ic('out')}ログアウト</button></div>
    <div class="small muted">接続先：${esc(CFG.api)}</div></main>${tabs('me')}`;
  root.querySelector('#logout').addEventListener('click', () => { TOKEN = null; ME = null; sessionStorage.removeItem('tenpo.token'); history.replaceState(null, '', location.pathname + location.search); boot(); });
  root.querySelector('#theme').addEventListener('click', () => { const h = document.documentElement; const cur = h.dataset.theme; h.dataset.theme = cur === 'yoru' ? (localStorage.getItem('tenpo.theme0') || 'orion') : (localStorage.setItem('tenpo.theme0', cur), 'yoru'); localStorage.setItem('tenpo.theme', h.dataset.theme); });
}
if (localStorage.getItem('tenpo.theme')) document.documentElement.dataset.theme = localStorage.getItem('tenpo.theme');
boot();
</script>
