<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="description" content="お店を始める人の、無料の開業支援。答えから最初の計画ができ、次に確かめることが1つずつ分かります。">

<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=1126b">
<link rel="canonical" href="https://start.tenpo-os.com/">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="TENPO/START">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TENPO/START｜開業支援</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EC;--card:#fff;--ink:#1d2622;--sub:#5d6862;--line:#e6e0d0;--green:#185534;--green2:#2f7550;--lime:#ecdfb6;--lime2:#f4eedb;--gold:#d9a040;
--tmp:#a36a00;--tmpbg:#fff5e0;--chk:#1d5fa8;--chkbg:#e8f1fb;--bad:#b23a2a;--badbg:#fbebe7;--ok:#2c7a4b;--okbg:#e6f4ec;--demo:#7a4fa3;--demobg:#f3ecfa}
*{box-sizing:border-box}
html,body{margin:0;background:#e7e6df;color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}input{font:inherit}
.demo{position:sticky;top:0;z-index:30;background:#2a2f2c;color:#fff;padding:8px 10px;font-size:12px}
.demo .row{display:flex;gap:6px;overflow-x:auto;align-items:center;max-width:860px;margin:0 auto;scrollbar-width:none}
.demo .row::-webkit-scrollbar{display:none}
.demo b{white-space:nowrap;opacity:.7;font-weight:500}
.demo button{white-space:nowrap;border:1px solid #5b625e;background:transparent;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px}
.demo button.on{background:#fff;color:#1d2622;border-color:#fff}
.demo .note{max-width:860px;margin:6px auto 0;opacity:.75;font-size:11px;line-height:1.5}
.phone{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:96px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.logo{font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--green)}.logo i{font-style:normal;color:#9db54a;margin:0 1px}
.lsub{font-size:10.5px;color:var(--sub);letter-spacing:.18em;margin-top:2px}
.ctx{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.biz{font-size:12px;font-weight:700;background:var(--lime2);color:var(--green);border-radius:999px;padding:3px 10px}
.top .day{font-size:11px;color:var(--sub)}
.ptitle{padding:6px 4px 2px}.ptitle h1{font-size:22px;margin:0}.ptitle p{margin:2px 0 0;font-size:12.5px;color:var(--sub)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tabbar button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);padding:7px 0 5px;border-radius:12px;position:relative}
.tabbar button.on{color:var(--green);background:var(--lime2);font-weight:700}
.tabbar em{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.wrap{padding:14px 14px 0}
.hero{background:var(--green);color:#fff;border-radius:18px;padding:20px 18px 18px}
.hero .k{font-size:12px;opacity:.85}.hero h1{font-size:21px;line-height:1.45;margin:6px 0 8px}.hero p{margin:0;font-size:13px;line-height:1.7;opacity:.92}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 4px;line-height:1.5}.card .lead{font-size:12.5px;color:var(--sub);margin:0 0 12px;line-height:1.7}
.big{font-size:30px;font-weight:700}.big small{font-size:14px;font-weight:500;margin-left:2px}
.eq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}.eq .op{color:var(--sub)}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;border-radius:10px;padding:6px 9px;border:1.5px solid var(--line);background:#fff;text-align:left;line-height:1.25}
.chip .v{font-weight:700;font-size:14px}.chip .t{font-size:10.5px;margin-top:2px}
.chip.ans{border-color:var(--green)}.chip.ans .t{color:var(--green)}
.chip.tmp{border-style:dashed;border-color:var(--tmp);background:var(--tmpbg)}.chip.tmp .t{color:var(--tmp)}
.chip.est{border-style:dashed;border-color:var(--chk);background:var(--chkbg)}.chip.est .t{color:var(--chk)}
.chip.obs{border-color:var(--chk);background:var(--chkbg)}.chip.obs .t{color:var(--chk)}
.chip.calc{border-color:#cfd3cf;background:#f6f6f2}.chip.calc .t{color:#6b7570}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1.5px solid}
.legend .a::before{border-color:var(--green)}.legend .m::before{border-color:var(--tmp);border-style:dashed;background:var(--tmpbg)}
.legend .o::before{border-color:var(--chk);background:var(--chkbg)}.legend .e::before{border-color:var(--chk);border-style:dashed;background:var(--chkbg)}
.rows{margin:0;padding:0;list-style:none}.rows li b{white-space:nowrap}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}.rows li:last-child{border-bottom:none}
.box{border-radius:12px;padding:12px 14px;margin-top:10px;border:1.5px solid var(--line)}
.box .q{font-size:12px;font-weight:700}.box .a{font-size:20px;font-weight:700;margin-top:2px}.box p{margin:6px 0 0;font-size:12.5px;line-height:1.7}
.box.ref{border-style:dashed;border-color:var(--tmp);background:var(--tmpbg)}.box.ref .q{color:var(--tmp)}
.box.res{border-color:var(--green);background:var(--lime2)}.box.res .q{color:var(--green2)}
.box.obsb{border-color:var(--chk);background:var(--chkbg)}.box.obsb .q{color:var(--chk)}
.btn{display:block;width:100%;border:none;background:var(--lime);color:var(--ink);border-radius:12px;padding:12px;font-weight:700;margin-top:12px;font-size:14px}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}.btn.dark{background:var(--green);color:#fff}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:12.5px;margin-top:8px}
.unc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.unc .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.unc .h b{font-size:14px}
.unc .imp{font-size:11.5px;color:var(--bad);white-space:nowrap}
.unc .meter{height:6px;background:#eee;border-radius:3px;margin:8px 0}.unc .meter div{height:100%;background:var(--tmp);border-radius:3px}
.unc p{font-size:12.5px;line-height:1.7;margin:4px 0 0}.unc .how{color:var(--sub)}
.tag{display:inline-block;font-size:10.5px;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;max-width:calc(100% - 4px);box-sizing:border-box;overflow-wrap:anywhere}
.tag.block{background:var(--badbg);color:var(--bad)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.ng{background:var(--badbg);color:var(--bad)}
.tag.unk{background:var(--tmpbg);color:var(--tmp)}.tag.ans{background:var(--lime2);color:var(--green)}.tag.doc{background:#eef0ee;color:#3c4640}
.tag.demo{background:var(--demobg);color:var(--demo)}.tag.who{background:var(--chkbg);color:var(--chk)}
.grp{font-size:12px;color:var(--sub);margin:14px 0 4px;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border:none;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.check .st{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid #c9ccc6;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.check .st.ok{background:var(--ok);border-color:var(--ok);color:#fff}.check .st.ng{background:var(--bad);border-color:var(--bad);color:#fff}.check .st.unk{background:var(--tmp);border-color:var(--tmp);color:#fff}
.check .tx{flex:1;min-width:0}.check .tx b{font-size:13.5px}.check .tx div{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.55}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--sub);font-weight:500}.tbl thead th{color:var(--ink);font-weight:700}
.tbl .cur{background:var(--lime2)}
.small{font-size:11.5px;color:var(--sub);line-height:1.6}
.verdict{border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.7}
.verdict.wait{background:var(--tmpbg)}.verdict.go{background:var(--okbg)}.verdict.stop{background:var(--badbg)}
.back{border-left:3px solid var(--lime);background:#fbfbf6;padding:12px 14px;border-radius:0 12px 12px 0;margin-bottom:12px}
.back h3{margin:0 0 6px;font-size:14px}.back ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.8}
.todo{counter-reset:t;list-style:none;margin:8px 0 0;padding:0}
.todo li{position:relative;padding:8px 0 8px 28px;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.6}
.todo li::before{counter-increment:t;content:counter(t);position:absolute;left:0;top:9px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.msg{background:#f6f6f2;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;margin-top:8px}
.qa{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.qa:last-child{border-bottom:none}
.qa .q{color:var(--sub);font-size:11.5px}.qa .q code{font-family:inherit;background:#f0f0ec;border-radius:4px;padding:0 4px;margin-right:4px}
.qa .a{font-weight:700;margin-top:2px}.qa .a.none{color:var(--tmp);font-weight:500}
.steps{display:flex;gap:3px;margin:10px 0 0}.steps i{flex:1;height:4px;border-radius:2px;background:var(--green)}
.mask{position:fixed;inset:0;background:rgba(20,25,22,.45);z-index:40;display:none}.mask.on{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;max-height:88vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;z-index:41;padding:18px 16px 28px;display:none}
.sheet.on{display:block}.sheet h3{margin:0 0 4px;font-size:17px;padding-right:36px}
.sheet .x{position:absolute;right:12px;top:10px;border:none;background:#f0f0ec;border-radius:999px;width:32px;height:32px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px}
.seg button.on{border-color:var(--green);background:var(--lime2);font-weight:700}
.field{margin-top:12px}.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input[type=number],.field input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--green);margin-top:8px}
.memo h2{font-size:15px;margin:16px 0 6px}.memo p,.memo li{font-size:12.5px;line-height:1.75}
.memo table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.memo td,.memo th{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left;line-height:1.55}.memo th{background:#f6f6f2}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1d2622;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.dinp{width:100%;border:1.5px dashed var(--tmp);background:var(--tmpbg);border-radius:10px;padding:10px;font-size:16px}
.nowp{border:2px solid var(--green)}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:6px}.ph>div{flex:1}.ph h2{margin:0}
.pn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.ri{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.ri.off{opacity:.55}
.ri .st{flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid #c9ccc6;background:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px;padding:0}
.ri .st.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ri .tx{flex:1;min-width:0}.ri .tx b{font-size:13.5px;line-height:1.5}
.ri .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--sub);margin:2px 0 3px}.ri .dl{color:var(--bad);font-weight:700}
.ri .nt{font-size:12px;color:var(--sub);line-height:1.65;margin-top:3px}.ri .tag{white-space:normal}
.sr{white-space:nowrap}.sr a,.srcl a{color:var(--chk)}.srcl{margin:0;padding-left:20px;font-size:12px;line-height:1.8}
.tabbar button{font-size:10.5px}
.ic{vertical-align:-3px;margin-right:5px;flex:none}.card h2 .ic{color:var(--green2)}
.pbar{height:8px;border-radius:4px;background:#e9e8e0;overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--green2);border-radius:4px;transition:width .3s}.pbar.sm{height:5px}
.kpi{display:flex;gap:14px;align-items:center;margin-bottom:8px}.kn{font-size:34px;font-weight:700;color:var(--green);line-height:1}.kn small{font-size:15px;color:var(--sub);font-weight:500}.kb{flex:1;font-size:13px}
.kh{display:flex;align-items:center;gap:4px}.kh h2{flex:1;margin:0}.kh .ic{color:var(--green2)}.kc{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
.kr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:none;border-bottom:1px solid var(--line);background:none;padding:11px 0;text-align:left;font-size:13px}.kr:last-child{border-bottom:none}
.kl{color:var(--sub);flex:0 0 44%}.kv{font-weight:700;text-align:right;border-radius:8px;padding:3px 8px;border:1.5px solid var(--green)}
.kv.you{border-color:var(--chk);background:var(--chkbg)}.kv.tmp{border-style:dashed;border-color:var(--tmp);background:var(--tmpbg)}
.kadd{color:var(--green2);font-weight:700;border:1.5px dashed #b9c3bd;border-radius:999px;padding:3px 12px;font-size:12px}
.strip{display:flex;gap:8px;margin-top:12px}.tile{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 10px 11px;text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.tile .ic{color:var(--green2);margin-bottom:2px}.tile span{font-size:11px;color:var(--sub)}.tile b{font-size:19px}.tile b small{font-size:11px;color:var(--sub);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:2px;font-size:11px;border-radius:999px;padding:2px 8px;background:#f0f0ec;color:#3c4640;white-space:nowrap}.pill .ic{margin-right:2px}
.pill.dl{background:var(--badbg);color:var(--bad);font-weight:700}.pill.ask{background:var(--tmpbg);color:var(--tmp);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.ri details summary b{display:block}.ri details[open] summary b::after{content:" ▲";font-size:9px;color:var(--sub)}.ri details:not([open]) summary b::after{content:" ▼";font-size:9px;color:var(--sub)}
.wl{display:flex;align-items:center;font-size:12px;color:var(--ink);margin-bottom:3px}.wl .ic{color:var(--green2)}
.pn.full{background:var(--ok)}
.dt summary{font-size:12px;color:var(--chk);margin-top:6px}.dt summary::before{content:"＋ "}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:12px}.sbar i{display:block;height:100%}
.sleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--sub);margin-top:6px}.sleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.chip.you{border-color:var(--chk);background:var(--chkbg)}.chip.you .t{color:var(--chk)}
.chip.ex{border-color:var(--green2);background:var(--lime2)}.chip.ex .t{color:var(--green2)}.kv.ex{border-color:var(--green2);background:var(--lime2)}
.legend .x::before{border-color:var(--green2);background:var(--lime2)}
.buddy{border:2px solid var(--green);background:#fbfdf6}.bh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green2);margin-bottom:6px}
.bav{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}.bav .ic{margin:0}
.tl{list-style:none;margin:8px 0 0;padding:0}.tl li{display:flex;gap:10px;font-size:12.5px;line-height:1.6;padding:7px 0 7px 14px;border-left:2px solid var(--lime);margin-left:5px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--green2)}.tl li span{color:var(--sub);flex:0 0 38px;font-size:11.5px}
.mtime{font-size:44px;font-weight:700;text-align:center;margin-top:12px;font-variant-numeric:tabular-nums}
.mtap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:150px;border:none;border-radius:20px;background:var(--green);color:#fff;margin:12px 0}
.mtap b{font-size:56px;line-height:1}.mtap span{font-size:13px;opacity:.85;margin-top:6px}.mtap:active{background:var(--green2)}
.mrec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px}.mrec div{display:flex;flex-direction:column}.mrec small{font-size:11px;color:var(--sub);font-weight:500}
.btn .ic{vertical-align:-3px}
.svb{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--green2);background:#fbfdf6;border-radius:12px;padding:10px 12px;margin-top:8px;text-align:left;color:var(--ink)}
.svb .ic{color:var(--green2);margin:0}.svb span{flex:1;display:flex;flex-direction:column}.svb .pbar{margin-top:5px}.svb b{font-size:13px}.svb small{font-size:11px;color:var(--sub)}.svb em{font-style:normal;color:var(--green2);font-weight:700}
.pill.sv{background:var(--lime2);color:var(--green);font-weight:700}
.shopc{padding:0;overflow:hidden}.shopc>.pills,.shopc>.sn,.shopc>.mk,.shopc>.pbar,.shopc>.strip{margin-left:16px;margin-right:16px}.shopc>.strip{margin-bottom:16px}
.art{display:block;width:100%;height:auto}.cov{height:170px;overflow:hidden}.cov img{width:100%;height:100%;object-fit:cover;display:block}
.sn{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:14px}.sn h1{font-size:22px;margin:0;line-height:1.3}.sn p{margin:2px 0 8px;font-size:12.5px;color:var(--sub)}
.edit{border:1.5px solid var(--green2);background:#fff;color:var(--green);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.mk{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:12px}.mk b{color:var(--green);font-size:14px}
.strip .tile b{font-size:17px}

function validValue(q,v){
 if(q.type==='select')return q.options.some(o=>o.value===v);
 if(q.type==='number')return typeof v==='number'&&Number.isFinite(v)&&v>=q.min&&(!q.integer||Number.isSafeInteger(v))&&(q.max===undefined||v<=q.max);
 if(q.type==='week')return Array.isArray(v)&&v.length===7&&v.every(x=>Array.isArray(x)&&x.length===2&&x.every(n=>n===0||n===1||n===2))&&v.some(x=>x[0]||x[1]);
 if(q.type==='text')return typeof v==='string'&&v.trim().length>0&&v.length<=q.maxLength;
 if(q.type==='group')return v && !Array.isArray(v) && typeof v==='object' &&
  Object.keys(v).every(k=>q.fields.some(f=>f.id===k)) &&
  q.fields.every(f=>v[f.id]===null || v[f.id]===undefined || validValue(f,v[f.id])) &&
  q.fields.some(f=>validValue(f,v[f.id]));
 return false;
}
function setAnswer(state,id,value,status,now){

 if(!stat.includes(status)||(status==='declined'&&!q.private))throw new Error('回答の状態を確かめてください');
 const has=['answered','provisional'].includes(status);
 if(has&&!validValue(q,value))throw new Error('単位と入力内容を確かめてください');
 const next=structuredClone(state);const oldModel=modelOf(state);
 next.answers[id]={value:has?structuredClone(value):null,status,source:'user',updatedAt:now};
 // A branch switch must never reinterpret 12 seats as 12 beds, or per-person price as per-check price.
 if(id==='businessType' && valueOf(next,id)!==valueOf(state,id) && next.answers.salesModel){
  next.archived.push({id:'salesModel',answer:next.answers.salesModel,at:now});delete next.answers.salesModel;
 }
 // 大項目を変えたら、合わなくなった中項目と売上の形を外す（消さずに archived へ）。
 if(id==='category' && valueOf(next,id)!==valueOf(state,id)){
  const b=valueOf(next,'businessType');
  const cn=c=>CAT_NOW[c]||c;if(next.answers.businessType&&b!==null&&categoryOf(b)!==cn(valueOf(next,'category'))){next.archived.push({id:'businessType',answer:next.answers.businessType,at:now});delete next.answers.businessType;}
  if(next.answers.salesModel){next.archived.push({id:'salesModel',answer:next.answers.salesModel,at:now});delete next.answers.salesModel;}
 }
 // 1回ごとと月謝では金額の意味が違うので、料金の形を変えたら金額を外す（消さずに archived へ）。
 if(id==='feeModel' && valueOf(state,id)!==null && valueOf(next,id)!==valueOf(state,id)){
  for(const k of ['averageSpendYen','secondSpendYen'])if(next.answers[k]){next.archived.push({id:k,answer:next.answers[k],at:now});delete next.answers[k];}
 }
 const newModel=modelOf(next);
 const reset=oldModel!==newModel?['capacity','averageSpendYen','secondSpendYen','serviceMinutes','peakStaff','helperHoursPerDay']:[];
 for(const field of ALL){if(next.answers[field.id]&&(reset.includes(field.id)||!isActive(field,next))){
  next.archived.push({id:field.id,model:oldModel,answer:next.answers[field.id],at:now});delete next.answers[field.id];
 }}
 next.updatedAt=now;return next;
}

function wishOf(){const s=st();s.wish=s.wish||{};s.wish.no=s.wish.no||{};return s.wish}

function pfOpenH(){const t=String((st().k||{}).hours||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)),m=t.match(/(\d{1,2})\s*(?:時|:|：)/);return m?+m[1]:null}

function pfLunchDef(f,gap){const va=1-(f.costRate+f.otherRate)/100,lp=Math.max(1000,Math.round(f.price*0.25/100)*100),per=Math.max(100,Math.round(lp*va/100)*100),times=8,add=5000;return{lp,times,add,ppl:Math.max(1,Math.ceil((Math.max(0,-gap)+times*add)/per/times))}}

 if(t.lunch){if(typeof t.lunch!=='object')t.lunch=pfLunchDef(f,b.gap);const L=t.lunch,per=Math.round(L.lp*va),month=Math.round(L.times*(L.ppl*per-L.add));lunch=Object.assign({},L,{per,month});gap+=month}

 return{b,tr,gap,lunch,tried:!!desc,desc}}

  if(pfSeatShop()){const seatsHere=p.tsubo&&f.perTsubo?Math.round(p.tsubo*f.perTsubo):null,sNeed=Math.ceil(base.need/f.turns);
   if(w.no.seats)skip.push(['席を増やす形',w.no.seats.here?'この物件では見送ったので、入れていません。':'「どの物件でも、席は増やさない」と聞いているので、入れていません。','seats']);

   else{const s2=Math.min(seatsHere,Math.max(sNeed,f.seats+1)),h2=Math.round(s2*f.turns),reach=h2>=base.need,sw=pfSeatWish(),inW=sw&&s2<=sw.max;

     why:reach?`いまと同じ1日${fmt(f.turns)}回転なら、${s2}席で1日${h2}${u}。要る${base.need}${u}に届きます。`:`${s2}席にすると1日${h2}${u}。要る${base.need}${u}まで、あと${base.need-h2}${u}です。`,
     need:`${f.extra!=null?f.extra+1:'いまの'}人で${s2}席を見られること`,chk:`厨房から全部の席が見えるか／${s2}席を置いて、人が通れるか`,btn:`この物件で、${s2}席で考える`,no:'この物件では見送る'})}}

     why:`足りない月${man(-base.gap)}を昼で作るには、昼1回に${ppl}人が要ります。${f.seats}席なら${fmt(ppl/f.seats)}回転です。<br><small>仮の条件：昼は1人${yen(lp)}・食材などを引いて1人${yen(per)}残る・追加の人件費など1回${yen(add)}</small>`,
